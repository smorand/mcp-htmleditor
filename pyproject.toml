[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-htmleditor"
version = "0.1.0"
requires-python = ">=3.11"
description = "MCP server + WYSIWYG HTML editor for LLM-assisted document creation"
dependencies = [
    "fastmcp>=2.0",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "click>=8.0",
]

[project.scripts]
mcp-htmleditor = "mcp_htmleditor.cli:main"

[tool.hatch.build.targets.wheel]
sources = ["src"]
