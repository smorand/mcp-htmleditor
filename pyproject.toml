[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-htmleditor"
version = "0.1.0"
requires-python = ">=3.11"
description = "MCP server + WYSIWYG HTML editor for LLM-assisted document creation"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "click>=8.0",
]

[project.scripts]
mcp-htmleditor = "mcp_htmleditor.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-beautifulsoup4",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = [
    "src/mcp_htmleditor/**/*.py",
    "src/mcp_htmleditor/static/**",
]

# Bundle repo-root templates/ and skill/ into the package so a plain
# `pip install` ships them (resolved as a fallback after ~/.config).
[tool.hatch.build.targets.wheel.force-include]
"templates" = "mcp_htmleditor/templates"
"skill" = "mcp_htmleditor/skill"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true
# click and fastmcp ship untyped decorators; strict mode would otherwise flag
# every @click.command / @mcp.tool() as "untyped-decorator". This is a local,
# single-user tool, so we relax only this one sub-check, not strictness overall.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["bs4.*", "pptx.*", "fastmcp.*", "click.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always test the working tree, never a previously installed (non-editable) copy
# of the package that would shadow src/ in site-packages.
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/mcp_htmleditor"]
omit = [
    "src/mcp_htmleditor/cli.py",
    "src/mcp_htmleditor/mcp_server.py",
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
