# Standalone file of the owner's VPS convention (web library mode, SPEC-0025): the image runs `webserve`, nginx on the
# `proxy-network` reaches it on port 7842, nothing is published on the host. The data (library database, presentation
# files, editor state, Google credentials file) lives in /app/data/mcp-htmleditor on the host.
# Deployed by `make deploy-vps TAG=vX.Y.Z` (see "Deploying the web library mode" in README.md); the local stack stays
# docker-compose.yml (`make run-up`).

services:
  mcp-htmleditor:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: mcp-htmleditor
    command: ["webserve"]
    restart: unless-stopped
    expose:
      - "7842"
    volumes:
      - /app/data/mcp-htmleditor:/data
    env_file:
      - /app/data/mcp-htmleditor/.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
