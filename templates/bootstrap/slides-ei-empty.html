<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Présentation — Euro-Information</title>
<style>
  :root {
    --ei-blue:        #003A8D;
    --ei-blue-2:      #284AAA;
    --ei-blue-light:  #285C99;
    --ei-orange:      #FBAE40;
    --ei-coral:       #EC6962;
    --ei-red:         #E7473D;
    --ei-gray:        #BEBEBE;
    --ei-gray-dark:   #50565B;
    --ei-text:        #262626;
    --ei-white:       #ffffff;
    --ei-bg-light:    #f4f6f9;
    --ei-font: 'Segoe UI', 'Selawik', 'Calibri', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:var(--ei-font); background:#e8e8e8; color:var(--ei-text);
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
  }

  /* ── Toolbar navigation (shell) ─────────────────────────────── */
  .toolbar {
    height:44px; background:var(--ei-blue); border-bottom:2px solid var(--ei-orange);
    display:flex; align-items:center; padding:0 16px; gap:14px; flex-shrink:0;
  }
  .cds-btn-icon {
    display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
    background:transparent; border:1px solid transparent; cursor:pointer; color:var(--ei-white);
    border-radius:2px; outline:none; flex-shrink:0;
  }
  .cds-btn-icon:hover { background:rgba(255,255,255,0.15); }
  .cds-btn-icon:disabled { opacity:.35; cursor:not-allowed; }
  .cds-btn-icon svg { width:16px; height:16px; fill:currentColor; }
  .toolbar-sep { width:1px; height:22px; background:rgba(255,255,255,0.25); }
  .cds-select-label { font-size:12px; color:rgba(255,255,255,0.8); white-space:nowrap; }
  .cds-select {
    appearance:none; -webkit-appearance:none; height:30px; min-width:260px; padding:0 32px 0 10px;
    background:var(--ei-white); border:1px solid var(--ei-blue-2); color:var(--ei-text);
    font-family:var(--ei-font); font-size:13px; cursor:pointer; outline:none; border-radius:2px;
  }
  .cds-select-wrapper { position:relative; display:inline-flex; align-items:center; }
  .cds-select-icon { position:absolute; right:9px; pointer-events:none; color:var(--ei-blue); }
  .cds-tag {
    display:inline-flex; align-items:center; height:24px; padding:0 12px;
    background:var(--ei-orange); color:var(--ei-blue); font-size:12px; font-weight:700;
    border-radius:100px; white-space:nowrap; margin-left:auto;
  }

  /* ── Stage ──────────────────────────────────────────────────── */
  .stage { flex:1; display:flex; align-items:stretch; overflow:hidden; background:#e8e8e8; }
  .nav-arrow {
    display:flex; align-items:center; justify-content:center; width:44px; background:#dfe3ea;
    border:none; cursor:pointer; color:var(--ei-blue); flex-shrink:0; outline:none;
  }
  .nav-arrow:hover:not(:disabled) { background:#c9d1de; }
  .nav-arrow:disabled { opacity:.25; cursor:not-allowed; }
  .nav-arrow svg { width:20px; height:20px; fill:currentColor; }
  .slide-frame { flex:1; display:flex; align-items:center; justify-content:center; padding:28px; overflow:hidden; }

  /* 16:9 slide canvas */
  .slide {
    display:none; position:relative; width:100%; max-width:960px; aspect-ratio:16/9;
    background:var(--ei-white); box-shadow:0 4px 18px rgba(0,0,0,.18);
    animation:fadein 200ms ease; overflow:hidden;
  }
  .slide.active { display:block; }
  /* translate (pas transform) pour ne jamais entrer en conflit avec le
     scale du plein écran ci-dessous: ce sont deux propriétés CSS indépendantes,
     l'animation d'entrée ne peut plus écraser le zoom pendant ses 200ms. */
  @keyframes fadein { from { opacity:0; translate:0 6px; } to { opacity:1; translate:0 0; } }

  /* ── Type: TITLE (couverture) ───────────────────────────────── */
  .slide[data-slide-type="title"] { background:var(--ei-white); }
  .slide-cover-img {
    width:100%; height:66%; object-fit:cover; display:block;
  }
  .slide-cover-body {
    position:absolute; bottom:0; left:0; right:0; height:34%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0 48px; text-align:center;
  }
  .slide-cover-title {
    font-size:30px; font-weight:700; color:var(--ei-blue); line-height:1.15;
  }
  .slide-cover-subtitle {
    font-size:15px; color:var(--ei-gray-dark); margin-top:8px;
  }
  .slide-cover-logos {
    position:absolute; bottom:18px; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between; padding:0 48px;
  }
  .slide-cover-logos .logos-left { display:flex; align-items:center; gap:20px; }
  .slide-cover-logos img.logo-cm  { height:26px; }
  .slide-cover-logos img.logo-cic { height:24px; }
  .slide-cover-logos img.logo-ei  { height:34px; }

  /* ── Type: SECTION (fond bleu) ──────────────────────────────── */
  .slide[data-slide-type="section"] { background:var(--ei-blue); }
  .slide-section-body {
    position:absolute; inset:0; display:flex; flex-direction:column;
    justify-content:center; padding:0 72px;
  }
  .slide-section-num {
    font-size:16px; font-weight:700; color:var(--ei-orange);
    letter-spacing:.1em; text-transform:uppercase; margin-bottom:12px;
  }
  .slide-section-title {
    font-size:40px; font-weight:700; color:var(--ei-white); line-height:1.15;
  }
  .slide-section-sub { font-size:16px; color:rgba(255,255,255,0.75); margin-top:14px; max-width:70%; }
  .slide-section-band {
    position:absolute; left:0; right:0; bottom:22%; height:6%; background:var(--ei-blue-2);
  }

  /* ── Type: CONTENT / AGENDA / DIAGRAM (cadre bleu carré, intérieur arrondi) ─ */
  .slide[data-slide-type="content"],
  .slide[data-slide-type="agenda"],
  .slide[data-slide-type="diagram"] {
    background:var(--ei-blue);   /* le bleu forme le cadre, coins extérieurs carrés */
    overflow:hidden;
  }
  /* Zone blanche intérieure: coins arrondis à l'INTÉRIEUR uniquement */
  .slide[data-slide-type="content"] .slide-inner,
  .slide[data-slide-type="agenda"]  .slide-inner,
  .slide[data-slide-type="diagram"] .slide-inner {
    position:absolute; inset:10px;
    background:var(--ei-white);
    border-radius:16px;
    display:flex; flex-direction:column;
    padding:30px 40px 50px;
  }
  .slide-eyebrow {
    font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ei-blue-2); margin-bottom:6px;
  }
  .slide-h1 { font-size:28px; font-weight:700; color:var(--ei-blue); line-height:1.15; }
  .slide-h1 span { color:var(--ei-orange); }
  .slide-subtitle { font-size:14px; color:var(--ei-gray-dark); margin-top:6px; }
  .slide-title-rule { height:3px; background:var(--ei-orange); width:64px; margin:12px 0 18px; }
  .slide-body { flex:1; overflow:hidden; }

  /* Slide footer: logo « b » EI au coin bas-gauche + page + meeting title */
  .slide-foot {
    position:absolute; left:0; right:0; bottom:0; height:40px; z-index:2;
    display:flex; align-items:center; padding:0 20px 6px 64px;
  }
  /* Logo EI: anneau bleu (même épaisseur que le cadre = 10px) autour d'un
     centre blanc d'environ 3× l'épaisseur du bord (~30px). Placé sur le coin
     bas-gauche pour se fondre dans le cadre. */
  .slide-foot-logo {
    position:absolute; left:2px; bottom:2px;
    width:50px; height:50px; border-radius:50%;
    background:var(--ei-white);
    border:10px solid var(--ei-blue);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; z-index:3; box-sizing:border-box;
  }
  .slide-foot-logo .logo-disc {
    display:flex; align-items:center; justify-content:center;
  }
  .slide-foot-logo .logo-disc img { height:16px; }
  .slide-foot-page { font-size:12px; color:var(--ei-blue); font-weight:700; }
  .slide-foot-title {
    flex:1; text-align:center; font-size:11px; color:var(--ei-blue-light);
    letter-spacing:.16em; text-transform:uppercase;
    font-family:var(--ei-font);
  }

  /* Components réutilisables (grille, tuiles, tableau, notif) */
  .cds-grid { display:grid; gap:14px; }
  .cols-2 { grid-template-columns:1fr 1fr; }
  .cols-3 { grid-template-columns:1fr 1fr 1fr; }
  .cds-tile { background:var(--ei-bg-light); border:1px solid #d9dee6; border-top:3px solid var(--ei-blue); padding:14px; }
  .cds-tile .tile-eyebrow { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ei-blue-2); margin-bottom:4px; }
  .cds-tile .tile-title { font-size:14px; font-weight:700; color:var(--ei-blue); margin-bottom:4px; }
  .cds-tile p { font-size:12px; color:var(--ei-gray-dark); line-height:1.5; }
  .cds-structured-list { width:100%; border-collapse:collapse; }
  .cds-structured-list thead th { background:var(--ei-blue); color:var(--ei-white); font-size:12px; font-weight:600; text-align:left; padding:8px 12px; text-transform:uppercase; letter-spacing:.03em; }
  .cds-structured-list tbody td { font-size:13px; padding:9px 12px; border-bottom:1px solid #e0e4ea; color:var(--ei-text); vertical-align:top; }
  .cds-structured-list tbody tr:last-child td { border-bottom:none; }
  .cds-notification { display:flex; gap:12px; padding:12px 16px; border-left:4px solid var(--ei-orange); background:#fff6e6; margin-top:14px; }
  .cds-notification .notif-title { font-size:13px; font-weight:700; color:var(--ei-blue); }
  .cds-notification .notif-body { font-size:12.5px; color:var(--ei-gray-dark); margin-top:2px; }
  .agenda-list { width:100%; border-collapse:collapse; }
  .agenda-list td { padding:12px 8px; border-bottom:1px solid #e0e4ea; font-size:16px; color:var(--ei-text); }
  .agenda-list td.num { width:56px; font-weight:700; color:var(--ei-orange); font-size:20px; }
  /* Lane (swimlane) grouping several arch-row: box derived automatically by the
     declarative layout engine (mcp-htmleditor arch-layout) from the union of its
     rows' node boxes, never guessed by hand. See skill/types/arch-diagram.md.
     The rest of the arch-* CSS (nodes, edges, shapes) is not shipped in the EI
     charter: declare it in the slide if the diagram needs it. */
  [data-type="arch-lane"] {
    position:absolute; box-sizing:border-box; pointer-events:none;
    border:1.5px dashed var(--ei-gray-dark); border-radius:8px;
  }
  [data-type="arch-lane"]::before {
    content: attr(data-label);
    position:absolute; top:-16px; left:6px;
    font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color: var(--ei-gray-dark);
    background:#fff; padding:0 4px; border-radius:2px;
  }
  [data-type="arch-col"] { position:absolute; box-sizing:border-box; }
  [data-type="arch-col"][data-label]::before {
    content: attr(data-label);
    position:absolute; top:4px; left:8px;
    font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color: var(--ei-gray-dark); pointer-events:none;
  }
  /* Numbered step badge on an arch-edge (data-step="N"): see slides-empty.html for the
     rationale, identical rule here so both charters share the same markup contract. */
  .arch-edge-badge {
    position:absolute; width:14px; height:14px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:8px; font-weight:700; line-height:1;
  }
  /* ── Mode présentation (fullscreen) — masquer UI, slide en plein écran ————— */
  :fullscreen .toolbar,
  :fullscreen .nav-arrow { display:none !important; }
  :fullscreen .stage { background:#000; }
  :fullscreen .slide-frame { padding:0; }
  /* Zoom uniforme (comme PowerPoint): la slide garde sa taille de conception
     (960x540) et est agrandie via transform scale au lieu d'être étirée —
     sinon le conteneur grandit mais les polices/cartes en px restent
     minuscules avec du vide autour. --fs-scale est calculé par
     updateFullscreenScale() plus bas dans le script. */
  :fullscreen .slide {
    border:none; box-shadow:none;
    scale: var(--fs-scale, 1);
    transform-origin: center center;
  }
  :fullscreen body { background:#000; }
</style>
</head>

</div>
  <button class="nav-arrow" id="nav-prev" onclick="navigate(-1)" disabled title="Précédent">
    <svg viewBox="0 0 24 24"><path d="M15.5 20 8 12l7.5-8 1.5 1.4L11 12l6 6.6z"></path></svg>
  </button>

  <div class="slide-frame">

    <!-- ═══ SLIDE 1 — TITRE (couverture) ═══ -->

<script>
  // ── À METTRE À JOUR à chaque ajout/suppression de slide ──────
  const TOTAL = 1;
  const slideNames = [
    "Titre de la présentation",
  ];
  // ─────────────────────────────────────────────────────────────

  let current = 0;
  const sel = document.getElementById('slide-select');

  function buildOptions() {
    sel.innerHTML = '';
    slideNames.forEach((name, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = String(i + 1).padStart(2, '0') + ' — ' + name;
      sel.appendChild(opt);
    });
  }

  function render() {
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
    const el = document.getElementById('slide-' + current);
    if (el) el.classList.add('active');
    sel.value = current;
    document.getElementById('progress-tag').textContent = (current + 1) + ' / ' + TOTAL;
    document.getElementById('btn-prev').disabled = current === 0;
    document.getElementById('nav-prev').disabled = current === 0;
    document.getElementById('btn-next').disabled = current === TOTAL - 1;
    document.getElementById('nav-next').disabled = current === TOTAL - 1;
    updateFullscreenScale();
  }

  // Plein écran = zoom uniforme, pas un étirement: la slide garde sa taille de
  // conception (960x540) et --fs-scale (transform scale, voir CSS) l'agrandit
  // pour remplir l'écran comme PowerPoint, polices et cartes comprises.
  function updateFullscreenScale() {
    const slide = document.querySelector('.slide.active');
    const root = document.documentElement;
    if (!document.fullscreenElement || !slide) {
      root.style.removeProperty('--fs-scale');
      return;
    }
    root.style.setProperty('--fs-scale', '1'); // mesurer la taille naturelle avant de recalculer
    const rect = slide.getBoundingClientRect();
    const scale = Math.min(window.innerWidth / rect.width, window.innerHeight / rect.height);
    root.style.setProperty('--fs-scale', String(scale));
  }

  document.addEventListener('fullscreenchange', updateFullscreenScale);
  window.addEventListener('resize', updateFullscreenScale);

  function navigate(dir) {
    const next = current + dir;
    if (next >= 0 && next < TOTAL) { current = next; render(); }
  }

  function goToSlide(idx) { current = parseInt(idx, 10); render(); }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); navigate(1); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')  navigate(-1);
    if (e.key === 'Home') goToSlide(0);
    if (e.key === 'End')  goToSlide(TOTAL - 1);
    if (e.key === 'f' || e.key === 'F') enterPresentation();
    if (e.key === 'Escape') exitPresentation();
  });

  function enterPresentation() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  function exitPresentation() {
    if (document.fullscreenElement) {
      document.exitFullscreen && document.exitFullscreen();
    }
  }

  buildOptions();
  render();
</script>
</body>
</html>
