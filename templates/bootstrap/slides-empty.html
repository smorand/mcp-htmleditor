<!DOCTYPE html>
<!--
  IBM Carbon Slides — Template bootstrap vide
  Usage: copier ce fichier, renseigner data-title sur chaque section,
         ajouter les slides dans .slide-frame, mettre à jour TOTAL et slideNames.
  Référence complète (catalogue de composants): templates/reference/slides/ibm-carbon.html
  Contrainte de hauteur utile et conventions dense/compact: mcp-htmleditor skill --type slides-carbon
-->
<html lang="fr" data-doc-type="presentation">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Présentation — IBM Carbon</title>
<style>
  :root {
    --cds-background:#ffffff; --cds-background-hover:#e8e8e8;
    --cds-layer-01:#f4f4f4; --cds-layer-02:#e0e0e0;
    --cds-border-subtle-01:#e0e0e0; --cds-border-strong-01:#8d8d8d;
    --cds-text-primary:#161616; --cds-text-secondary:#525252;
    --cds-text-placeholder:#a8a8a8; --cds-text-on-color:#ffffff;
    --cds-interactive:#0f62fe; --cds-focus:#0f62fe;
    --cds-icon-primary:#161616; --cds-support-success:#198038;
    --cds-support-error:#da1e28; --cds-inverse-text:#f4f4f4;
    --ibm-blue-60:#0f62fe; --ibm-blue-70:#0043ce; --ibm-blue-10:#edf5ff;
    --ibm-gray-10:#f4f4f4; --ibm-gray-20:#e0e0e0; --ibm-gray-100:#161616;
    --cds-spacing-02:4px; --cds-spacing-03:8px; --cds-spacing-04:12px;
    --cds-spacing-05:16px; --cds-spacing-07:32px; --cds-spacing-08:40px;
    --cds-font-family-sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --cds-font-family-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:var(--cds-font-family-sans); background:var(--cds-background);
    color:var(--cds-text-primary); height:100vh; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .shell-header {
    height:48px; background:var(--ibm-gray-100); display:flex; align-items:center;
    padding:0 var(--cds-spacing-05); gap:var(--cds-spacing-05);
    flex-shrink:0; border-bottom:1px solid #393939;
  }
  .shell-logo { display:flex; align-items:center; gap:var(--cds-spacing-03); color:var(--cds-inverse-text); font-size:14px; }
  .shell-logo .product-name { font-weight:600; color:#78a9ff; }
  .shell-divider { width:1px; height:20px; background:#393939; }
  .shell-title { color:#c6c6c6; font-size:14px; }
  .toolbar {
    height:48px; background:var(--ibm-gray-10); border-bottom:1px solid var(--cds-border-subtle-01);
    display:flex; align-items:center; padding:0 var(--cds-spacing-05); gap:var(--cds-spacing-05); flex-shrink:0;
  }
  .cds-select-wrapper { position:relative; display:inline-flex; align-items:center; }
  .cds-select-label { font-size:12px; color:var(--cds-text-secondary); margin-right:var(--cds-spacing-03); white-space:nowrap; }
  .cds-select {
    appearance:none; -webkit-appearance:none; height:32px; min-width:260px; padding:0 36px 0 12px;
    background:var(--cds-background); border:1px solid var(--cds-border-strong-01);
    border-bottom-color:var(--ibm-gray-100); color:var(--cds-text-primary);
    font-family:var(--cds-font-family-sans); font-size:14px; cursor:pointer; outline:none;
  }
  .cds-select:focus { border-color:var(--cds-focus); box-shadow:inset 0 0 0 1px var(--cds-focus); }
  .cds-select-icon { position:absolute; right:10px; pointer-events:none; color:var(--cds-icon-primary); }
  .cds-btn-icon {
    display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px;
    background:transparent; border:1px solid transparent; cursor:pointer; color:var(--cds-icon-primary);
    border-radius:0; outline:none; flex-shrink:0;
  }
  .cds-btn-icon:hover { background:var(--cds-background-hover); }
  .cds-btn-icon:disabled { opacity:.3; cursor:not-allowed; }
  .cds-btn-icon svg { width:16px; height:16px; fill:currentColor; }
  .toolbar-sep { width:1px; height:24px; background:var(--cds-border-subtle-01); }
  .cds-tag {
    display:inline-flex; align-items:center; height:24px; padding:0 var(--cds-spacing-03);
    background:var(--ibm-blue-10); color:var(--ibm-blue-70); font-size:12px; font-weight:600;
    border-radius:100px; white-space:nowrap; margin-left:auto;
  }
  .stage { flex:1; display:flex; align-items:stretch; overflow:hidden; background:#e8e8e8; }
  .nav-arrow {
    display:flex; align-items:center; justify-content:center; width:48px; background:var(--ibm-gray-10);
    border:none; cursor:pointer; color:var(--cds-icon-primary); flex-shrink:0; outline:none;
  }
  .nav-arrow:hover:not(:disabled) { background:var(--ibm-gray-20); }
  .nav-arrow:disabled { opacity:.25; cursor:not-allowed; }
  .nav-arrow svg { width:20px; height:20px; fill:currentColor; }
  .slide-frame { flex:1; display:flex; align-items:center; justify-content:center; padding:var(--cds-spacing-07); overflow:hidden; }
  /* Canevas fixe 16:9 (960x540), aligne sur la charte EI: une slide Carbon
     est desormais une vraie diapositive a taille fixe, pas un document qui
     grandit avec son contenu. Le contenu qui deborde est rogne (overflow:
     hidden), jamais scrollé en silence — voir mcp-htmleditor skill --type slides-carbon,
     section "Hauteur utile d'une slide". */
  .slide {
    display:none; width:100%; max-width:960px; aspect-ratio:16/9; background:var(--cds-background);
    border:1px solid var(--cds-border-subtle-01); box-shadow:0 4px 16px rgba(0,0,0,.12);
    flex-direction:column; animation:fadein 200ms ease; overflow:hidden;
  }
  .slide.active { display:flex; }
  /* translate (pas transform) pour ne jamais entrer en conflit avec le
     scale du plein écran ci-dessous: ce sont deux propriétés CSS indépendantes,
     l'animation d'entrée ne peut plus écraser le zoom pendant ses 200ms. */
  @keyframes fadein { from { opacity:0; translate:0 6px; } to { opacity:1; translate:0 0; } }
  .slide-header { padding:var(--cds-spacing-07) var(--cds-spacing-08); border-bottom:4px solid var(--ibm-blue-60); }
  .slide-eyebrow { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ibm-blue-60); margin-bottom:var(--cds-spacing-03); }
  .slide-h1 { font-size:36px; font-weight:300; line-height:1.2; color:var(--cds-text-primary); letter-spacing:-.01em; }
  .slide-h1 strong { font-weight:600; }
  .slide-subtitle { margin-top:var(--cds-spacing-04); font-size:16px; color:var(--cds-text-secondary); line-height:1.5; max-width:600px; }
  .slide-body { padding:var(--cds-spacing-07) var(--cds-spacing-08); flex:1; }
  /* Slide dense: paddings resserres pour tenir dans la hauteur utile (voir
     mcp-htmleditor skill --type slides-carbon, section hauteur utile). Usage: class="slide dense". */
  .slide.dense .slide-header { padding:22px var(--cds-spacing-08) 18px; }
  .slide.dense .slide-body { padding:18px var(--cds-spacing-08); }
  .slide-footer {
    height:40px; padding:0 var(--cds-spacing-08); border-top:1px solid var(--cds-border-subtle-01);
    display:flex; align-items:center; justify-content:space-between; background:var(--ibm-gray-10); flex-shrink:0;
  }
  .slide-footer-left { font-size:11.5px; color:var(--cds-text-secondary); }
  .slide-footer-right { font-size:11.5px; color:var(--cds-text-placeholder); }
  /* Slide sans .slide-body (couverture, coupure de section): sans cet espace, le filet
     bleu bas du .slide-header se retrouve plaque contre la bordure du .slide-footer et
     se lit comme une double bordure parasite. */
  .slide-header + .slide-footer { margin-top:64px; }
  .cds-grid { display:grid; gap:var(--cds-spacing-05); }
  .cols-2 { grid-template-columns:1fr 1fr; }
  .cols-3 { grid-template-columns:1fr 1fr 1fr; }
  .cols-4 { grid-template-columns:1fr 1fr 1fr 1fr; }
  .cds-tile { background:var(--ibm-gray-10); border:1px solid var(--cds-border-subtle-01); padding:var(--cds-spacing-05); }
  .cds-tile .tile-eyebrow { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ibm-blue-60); margin-bottom:var(--cds-spacing-02); }
  .cds-tile .tile-title { font-size:14px; font-weight:600; color:var(--cds-text-primary); margin-bottom:var(--cds-spacing-02); }
  .cds-tile p { font-size:12.5px; color:var(--cds-text-secondary); line-height:1.55; }
  .cds-structured-list { width:100%; border-collapse:collapse; }
  .cds-structured-list thead th { background:var(--ibm-gray-100); color:var(--cds-inverse-text); font-size:12px; font-weight:600; text-align:left; padding:var(--cds-spacing-03) var(--cds-spacing-05); letter-spacing:.04em; text-transform:uppercase; }
  .cds-structured-list tbody td { font-size:13px; padding:var(--cds-spacing-04) var(--cds-spacing-05); border-bottom:1px solid var(--cds-border-subtle-01); color:var(--cds-text-primary); vertical-align:top; }
  .cds-structured-list tbody tr:last-child td { border-bottom:none; }
  /* Variante dense: le padding par defaut fait deborder une table de 5 lignes
     accompagnee d'une notification hors de la hauteur utile de la slide. */
  .cds-structured-list.compact tbody td { padding:8px var(--cds-spacing-05); }
  .agenda-list { width:100%; border-collapse:collapse; }
  .agenda-list td { padding:12px 8px; border-bottom:1px solid var(--cds-border-subtle-01); font-size:15px; color:var(--cds-text-primary); }
  .agenda-list td.num { width:56px; font-weight:700; color:var(--ibm-blue-60); font-size:20px; }
  .cds-notification { display:flex; gap:var(--cds-spacing-04); padding:var(--cds-spacing-04) var(--cds-spacing-05); border-left:4px solid var(--ibm-blue-60); background:var(--ibm-blue-10); margin-top:var(--cds-spacing-05); }
  .cds-notification .notif-title { font-size:13px; font-weight:600; color:var(--ibm-blue-70); }
  .cds-notification .notif-body { font-size:12.5px; color:var(--cds-text-secondary); margin-top:2px; }
  .cds-notification.success { border-left-color:#198038; background:#defbe6; }
  .cds-notification.success .notif-title { color:#0e6027; }
  .cds-notification.warning { border-left-color:#f1c21b; background:#fdf6dd; }
  .cds-notification.warning .notif-title { color:#8e6a00; }
  .cds-notification.error { border-left-color:#da1e28; background:#fff1f1; }
  .cds-notification.error .notif-title { color:#a2191f; }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--cds-spacing-05); margin-top:var(--cds-spacing-05); }
  .stat-card { background:var(--ibm-gray-10); border-left:4px solid var(--ibm-blue-60); padding:var(--cds-spacing-05); }
  .stat-value { font-size:32px; font-weight:300; color:var(--ibm-blue-60); line-height:1; }
  .stat-label { font-size:12px; color:var(--cds-text-secondary); margin-top:var(--cds-spacing-02); }
  .cds-code { font-family:var(--cds-font-family-mono); font-size:12px; background:var(--ibm-gray-10); border:1px solid var(--cds-border-subtle-01); padding:1px 6px; color:var(--ibm-blue-70); }
  .tag-blue { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:100px; background:#dbeafe; color:#1d4ed8; }
  .tag-green { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:100px; background:#d1fae5; color:#065f46; }
  .tag-purple { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:100px; background:#ede9fe; color:#5b21b6; }
  .tag-gray { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:100px; background:#e0e0e0; color:#525252; }
  .tag-red { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:100px; background:#ffd7d9; color:#a2191f; }
  /* Barre de repartition proportionnelle */
  .cw-bar { display:flex; border:1px solid var(--cds-border-subtle-01); overflow:hidden; height:32px; margin-top:var(--cds-spacing-04); border-radius:2px; }
  .cw-seg { display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; overflow:hidden; white-space:nowrap; padding:0 6px; }
  /* Pastilles de mention */
  .mention-wrap { display:flex; flex-wrap:wrap; gap:var(--cds-spacing-03); margin-top:var(--cds-spacing-04); }
  .mention-pill {
    display:inline-flex; align-items:center; gap:var(--cds-spacing-02);
    padding:var(--cds-spacing-02) var(--cds-spacing-04);
    background:var(--ibm-gray-10); border:1px solid var(--cds-border-subtle-01);
    font-size:12px; color:var(--cds-text-primary);
  }
  .mention-pill code { font-family:var(--cds-font-family-mono); font-size:11.5px; color:var(--ibm-blue-60); }
  .mention-pill span { color:var(--cds-text-secondary); font-size:11.5px; }
  /* Gantt: les pourcentages des barres sont relatifs a la piste (.gantt-track),
     jamais a la ligne entiere, sinon la colonne de libelles fausse l'echelle. */
  .gantt-scale { display:flex; margin-bottom:var(--cds-spacing-03); }
  .gantt-scale .gantt-label-col { width:172px; flex-shrink:0; }
  .gantt-scale .q { flex:1; text-align:center; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--cds-text-secondary); border-left:1px solid var(--ibm-gray-20); }
  .gantt-row { display:flex; align-items:center; margin-bottom:6px; }
  .gantt-row .gantt-label { width:172px; flex-shrink:0; font-size:12px; color:var(--cds-text-primary); padding-right:var(--cds-spacing-04); }
  .gantt-track { flex:1; position:relative; height:26px; background:var(--ibm-gray-10);
    background-image:linear-gradient(to right, var(--ibm-gray-20) 0 1px, transparent 1px 100%);
    background-size:25% 100%; }
  .gantt-bar { position:absolute; top:0; height:26px; display:flex; align-items:center; padding:0 8px;
    font-size:11px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; }
  /* Schema d'architecture: noeuds, formes, connecteurs, pointes, libelles.
     data-shape et data-style ont un rendu reel grace aux selecteurs d'attribut. */
  .arch-node {
    box-sizing:border-box; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    font-size:11.5px; font-weight:700; line-height:1.25; padding:4px 6px;
  }
  .arch-node small, .arch-node-label { display:block; font-weight:400; font-size:10px; margin-top:2px; color:var(--cds-text-secondary); }
  .arch-box, .arch-node[data-shape="box"] { border-radius:0; }
  .arch-circle, .arch-node[data-shape="circle"] { border-radius:50%; }
  .arch-cylinder, .arch-node[data-shape="cylinder"] { border-radius:8px / 20px; }
  .arch-cloud, .arch-node[data-shape="cloud"] { border-radius:50px; }
  .arch-diamond, .arch-node[data-shape="diamond"] { transform:rotate(45deg); }
  .arch-diamond > *, .arch-node[data-shape="diamond"] > * { transform:rotate(-45deg); }
  .arch-edge { position:absolute; }
  .arch-line-h { height:0; border-top:1.5px solid var(--ibm-blue-60); }
  .arch-line-v { width:0; border-left:1.5px solid var(--ibm-blue-60); }
  .arch-line-h.dashed, .arch-line-v.dashed, .arch-edge[data-style="dashed"] { border-style:dashed; }
  .arch-line-h.dotted, .arch-line-v.dotted, .arch-edge[data-style="dotted"] { border-style:dotted; }
  .arch-tip { width:0; height:0; }
  .arch-tip-r { border-left:7px solid var(--ibm-blue-60); border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; }
  .arch-tip-l { border-right:7px solid var(--ibm-blue-60); border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; }
  .arch-tip-d { border-top:7px solid var(--ibm-blue-60); border-left:4.5px solid transparent; border-right:4.5px solid transparent; }
  .arch-tip-u { border-bottom:7px solid var(--ibm-blue-60); border-left:4.5px solid transparent; border-right:4.5px solid transparent; }
  .arch-edge-label { position:absolute; font-size:9.5px; color:var(--cds-text-secondary); white-space:nowrap; }
  /* Lane (swimlane) grouping several arch-row: box derived automatically by the
     declarative layout engine (mcp-htmleditor arch-layout) from the union of its
     rows' node boxes, never guessed by hand. See mcp-htmleditor skill --type arch-diagram. */
  [data-type="arch-lane"] {
    position:absolute; box-sizing:border-box; pointer-events:none;
    border:1.5px dashed var(--cds-border-strong-01); border-radius:8px;
  }
  [data-type="arch-lane"]::before {
    content: attr(data-label);
    position:absolute; top:-16px; left:6px;
    font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color: var(--cds-text-secondary);
    background:#fff; padding:0 4px; border-radius:2px;
  }
  /* An arch-col's own box already is the slot rectangle (unlike a lane's derived
     union box), so giving it a border/background directly makes it read as one
     bordered card wrapping its stacked nodes. The corner label sits INSIDE the
     box (not above it, unlike a lane): a col commonly starts at the diagram's own
     top edge, and a slide has a hard overflow:hidden budget (mcp-htmleditor skill --type slides-carbon
     § Hauteur utile) that would silently clip a label floated above row 0. */
  [data-type="arch-col"] { position:absolute; box-sizing:border-box; }
  [data-type="arch-col"][data-label]::before {
    content: attr(data-label);
    position:absolute; top:4px; left:8px;
    font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color: var(--cds-text-secondary); pointer-events:none;
  }
  /* Numbered step badge on an arch-edge (data-step="N"): a small filled circle at the
     connector's true on-segment midpoint, distinct from the optional text label which
     stays offset beside/below it. Background colour set inline per edge (data-color). */
  .arch-edge-badge {
    position:absolute; width:14px; height:14px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:8px; font-weight:700; line-height:1;
  }
  .status-bar { height:24px; background:var(--ibm-gray-100); display:flex; align-items:center; padding:0 var(--cds-spacing-05); gap:var(--cds-spacing-05); flex-shrink:0; border-top:1px solid #393939; }
  .status-bar span { font-size:11px; color:#8d8d8d; }
  .status-bar .status-active { color:#42be65; }
  /* ── Mode présentation (fullscreen) — masquer UI, slide en plein écran ————— */
  :fullscreen .shell-header,
  :fullscreen .toolbar,
  :fullscreen .nav-arrow,
  :fullscreen .status-bar { display:none !important; }
  :fullscreen .stage { background:#000; }
  :fullscreen .slide-frame { padding:0; }
  /* Zoom uniforme (comme PowerPoint): la slide garde sa taille de conception
     et est agrandie via transform scale au lieu d'être étirée — sinon le
     conteneur grandit mais les polices/cartes en px restent minuscules avec
     du vide autour. --fs-scale est calculé par updateFullscreenScale(). */
  :fullscreen .slide {
    border:none; box-shadow:none;
    scale: var(--fs-scale, 1);
    transform-origin: center center;
  }
  :fullscreen body { background:#000; }
</style>
</head>
<body>

<header class="shell-header">
  <div class="shell-logo">
    <svg width="20" height="20" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="4" fill="#0f62fe"></rect>
      <text x="7" y="22" fill="#fff" font-family="IBM Plex Sans,sans-serif" font-size="16" font-weight="700">P</text>
    </svg>
    <span class="product-name">Produit</span>
  </div>
  <div class="shell-divider"></div>
  <span class="shell-title">Titre de la présentation</span>
</header>

<div class="toolbar">
  <button class="cds-btn-icon" id="btn-prev" onclick="navigate(-1)" title="Précédent (←)" disabled>
    <svg viewBox="0 0 16 16"><path d="M10.5 15.5 3 8l7.5-7.5 1.4 1.4L5.8 8l6.1 6.1z"></path></svg>
  </button>
  <button class="cds-btn-icon" id="btn-next" onclick="navigate(1)" title="Suivant (→)">
    <svg viewBox="0 0 16 16"><path d="M5.5.5 13 8l-7.5 7.5-1.4-1.4L10.2 8 4.1 1.9z"></path></svg>
  </button>
  <div class="toolbar-sep"></div>
  <span class="cds-select-label">Diapositive :</span>
  <div class="cds-select-wrapper">
    <select class="cds-select" id="slide-select" onchange="goToSlide(this.value)"></select>
    <svg class="cds-select-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 11L3 6h10z"></path></svg>
  </div>
  <span class="cds-tag" id="progress-tag">1 / 1</span>
  <div style="margin-left:auto;"></div>
  <button class="cds-btn-icon" id="btn-present" onclick="enterPresentation()" title="Présenter (F)">
    <svg viewBox="0 0 16 16"><path d="M1 1h14v10H9v2h2v1H5v-1h2v-2H1zm1 1v8h12V2z"></path></svg>
  </button>
  <button class="cds-btn-icon" id="btn-pointer" onclick="presentWithPointer()" title="Présenter avec le pointeur (L)" aria-label="Présenter avec le pointeur (L)" style="width:auto;padding:0 12px">Pointeur</button>
</div>

<div class="stage">
  <button class="nav-arrow" id="nav-prev" onclick="navigate(-1)" disabled title="Précédent">
    <svg viewBox="0 0 24 24"><path d="M15.5 20 8 12l7.5-8 1.5 1.4L11 12l6 6.6z"></path></svg>
  </button>

  <div class="slide-frame">

    <!-- SLIDE 1 — Couverture. Dupliquer ce bloc pour chaque nouvelle slide.
         Mettre à jour TOTAL et slideNames dans le <script> en bas. -->

<script>
  // ── À METTRE À JOUR à chaque ajout/suppression de slide ──────
  const TOTAL = 1;
  const slideNames = [
    "Titre de la présentation",
  ];
  // ─────────────────────────────────────────────────────────────

  let current = 0;
  const sel = document.getElementById('slide-select');

  // Regénère les options du dropdown (vide d'abord pour éviter les doublons)
  function buildOptions() {
    sel.innerHTML = '';
    slideNames.forEach((name, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = String(i + 1).padStart(2, '0') + ' — ' + name;
      sel.appendChild(opt);
    });
  }

  function render() {
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
    const el = document.getElementById('slide-' + current);
    if (el) el.classList.add('active');
    sel.value = current;
    document.getElementById('progress-tag').textContent = (current + 1) + ' / ' + TOTAL;
    document.getElementById('status-slide').textContent =
      'Slide ' + (current + 1) + ' / ' + TOTAL + ' — ' + slideNames[current];
    document.getElementById('btn-prev').disabled = current === 0;
    document.getElementById('nav-prev').disabled = current === 0;
    document.getElementById('btn-next').disabled = current === TOTAL - 1;
    document.getElementById('nav-next').disabled = current === TOTAL - 1;
    updateFullscreenScale();
  }

  // Plein écran = zoom uniforme, pas un étirement: la slide garde sa taille de
  // conception et --fs-scale (transform scale, voir CSS) l'agrandit pour
  // remplir l'écran comme PowerPoint, polices et cartes comprises.
  function updateFullscreenScale() {
    const slide = document.querySelector('.slide.active');
    const root = document.documentElement;
    if (!document.fullscreenElement || !slide) {
      root.style.removeProperty('--fs-scale');
      return;
    }
    root.style.setProperty('--fs-scale', '1'); // mesurer la taille naturelle avant de recalculer
    const rect = slide.getBoundingClientRect();
    const scale = Math.min(window.innerWidth / rect.width, window.innerHeight / rect.height);
    root.style.setProperty('--fs-scale', String(scale));
  }

  document.addEventListener('fullscreenchange', updateFullscreenScale);
  window.addEventListener('resize', updateFullscreenScale);

  function navigate(dir) {
    const next = current + dir;
    if (next >= 0 && next < TOTAL) { current = next; render(); }
  }

  function goToSlide(idx) { current = parseInt(idx, 10); render(); }

  document.addEventListener('keydown', e => {
    const ae = document.activeElement;
    if (ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); navigate(1); }
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')  navigate(-1);
    if (e.key === 'Home') goToSlide(0);
    if (e.key === 'End')  goToSlide(TOTAL - 1);
    if ((e.key === 'l' || e.key === 'L') && !e.ctrlKey && !e.metaKey && !e.altKey) togglePointer();
    if (e.key === 'Escape') exitPresentation();
  });

  function enterPresentation() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  function exitPresentation() {
    if (document.fullscreenElement) {
      document.exitFullscreen && document.exitFullscreen();
    }
  }

  buildOptions();
  render();
</script>

<script id="deck-pointer-script">
  (function () {
    var DOT = 18, HALO = 2, GAP = 6, LINE = 3;   // en pixels de slide
    // Zones de mise en page des slides, de tous les modèles: jamais une boîte (SPEC-0017 DEC-009).
    var LAYOUT_AREAS = '.slide-header, .slide-title-area, .med-head, .slide-body, .slide-footer, '
      + '.slide-footer-right, .slide-foot, .slide-foot-page, .med-foot, .med-cover-foot, .med-band, .slide-inner';
    var CONTROLS = 'a[href], button, input, select, textarea';
    var REPLACED = {IMG: 1, SVG: 1, VIDEO: 1, CANVAS: 1};
    var allowed = true, armed = false, on = false;
    var lastPoint = null, layer = null, dot = null, frame = 0;
    var ring = null, ringBox = null, shownSlide = null;

    function currentSlide() {
      return document.querySelector('[data-type="slide"].active, [data-type="slide"][data-fs-current]')
        || document.querySelector('[data-type="slide"]');
    }

    // Calque fixe hors de toute slide, posé sur le rectangle de la slide courante (qui le rogne);
    // s = facteur d'échelle de la slide, les tailles sont données en pixels de slide.
    function draw() {
      var slide = currentSlide();
      if (!layer || !slide) return;
      followSlide(slide);
      var r = slide.getBoundingClientRect();
      var s = slide.offsetWidth ? r.width / slide.offsetWidth : 1;
      layer.style.left = r.left + 'px'; layer.style.top = r.top + 'px';
      layer.style.width = r.width + 'px'; layer.style.height = r.height + 'px';

      var inside = lastPoint && lastPoint.x >= r.left && lastPoint.x <= r.right
        && lastPoint.y >= r.top && lastPoint.y <= r.bottom;
      if (!inside) { dot.style.display = 'none'; return; }
      dot.style.display = 'block';
      dot.style.width = dot.style.height = DOT * s + 'px';
      dot.style.left = lastPoint.x - r.left - DOT / 2 * s + 'px';
      dot.style.top = lastPoint.y - r.top - DOT / 2 * s + 'px';
      dot.style.boxShadow = '0 0 0 ' + HALO * s + 'px #FFFFFF';
    }

    // Anneau autour de sa boîte, redessiné à chaque image (animation d'entrée, redimensionnement).
    // Rayons: un pourcentage est gardé (un cercle reste un cercle), une longueur est mise à l'échelle
    // puis agrandie de GAP.
    function drawRing(r, s) {
      if (!ring) return;
      if (!ringBox.isConnected) { removeRing(); return; }

      ring.style.height = b.height + 2 * GAP * s + 'px';

      });
    }

    function removeRing() {
      if (ring) ring.remove();
      ring = ringBox = null;
    }

    // Changer de slide enlève l'anneau (FR-NEW-007); vu par la boucle comme par un clic arrivé avant elle.
    function followSlide(slide) {

    }

    function showRing(box) {

    // FR-NEW-005, lectures de DEC-008: un dessin compte pour un, un tableau est sa propre boîte, puis la
    // première carte (fond, ombre ou bordure sur les quatre côtés) qui ne contient pas deux cartes, sinon

        if (e.tagName.toUpperCase() === 'TABLE') return e;
      }
      for (e = start; e && e !== slide; e = e.parentElement) {
        if (candidate(e) && Array.prototype.filter.call(e.children, candidate).length < 2) return e;
      }
      for (e = start; e && e !== slide; e = e.parentElement) {

    // l'élément en ligne n'est jamais la boîte, son bloc l'est (FR-NEW-005 règles 4 et 5).
    function holdsText(e) {
      for (var n = e.firstChild; n; n = n.nextSibling) {

    }

    // garde son clic et l'anneau ne change pas (FR-NEW-006, FR-NEW-008). Un toucher produit aussi un clic.
    document.addEventListener('click', function (e) {
      var slide = currentSlide();
      if (!on || !slide || !(e.target instanceof Element) || !slide.contains(e.target)) return;
      var control = e.target.closest(CONTROLS);

    function loop() { draw(); frame = requestAnimationFrame(loop); }

    function turnOn() {
      if (on) return;
      on = true;
      document.documentElement.setAttribute('data-deck-pointer', '');
      layer = document.createElement('div'); layer.id = 'deck-pointer-layer';
      dot = document.createElement('div'); dot.id = 'deck-pointer-dot';
      layer.appendChild(dot);
      document.body.appendChild(layer);
      shownSlide = currentSlide();
      loop();
    }

    function turnOff() {
      on = false;
      cancelAnimationFrame(frame);
      if (layer) layer.remove();
      layer = dot = ring = ringBox = shownSlide = null;
      document.documentElement.removeAttribute('data-deck-pointer');
    }

    window.armPointer = function (value) { armed = !!value && allowed; };

    window.presentWithPointer = function () {
      window.armPointer(true);
      var el = document.documentElement;
      try {

    };

    window.togglePointer = function () {
      if (!document.fullscreenElement || !allowed) return;
      if (on) turnOff(); else turnOn();
    };

    window.setPointerAllowed = function (value) {
      allowed = !!value;
      if (!allowed) { armed = false; turnOff(); }
    };

    // Une présentation démarre éteinte (la sortie l'éteint), sauf si le contrôle Pointeur l'a armée.
    // L'entrée n'éteint jamais: l'événement arrive une image après fullscreenElement, et un L tapé
    // entre les deux ne doit pas être annulé.
    document.addEventListener('fullscreenchange', function () {
      if (!document.fullscreenElement) turnOff();
      else if (armed && allowed) turnOn();
      armed = false;
    });
    // Seule la souris montre le point; un contact tactile ou stylet, ou la sortie de la fenêtre, le cache.
    document.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'mouse') { lastPoint = {x: e.clientX, y: e.clientY}; draw(); }
    }, true);
    document.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse') { lastPoint = null; draw(); }
    }, true);
    document.addEventListener('mouseout', function (e) {
      if (!e.relatedTarget) { lastPoint = null; draw(); }
    }, true);
  })();
</script>

      + '$("p-timer").textContent=p(Math.floor(s/3600))+":"+p(Math.floor(s/60)%60)+":"+p(s%60);'
      + '$("p-clock").textContent=new Date().toLocaleTimeString();}'
      + 'function font(d){size=Math.max(12,Math.min(72,size+d));$("p-notes").style.fontSize=size+"px";}'
      + 'addEventListener("message",function(e){var d=e.data;if(e.source!==opener_||!d||d.type!=="deck-state")return;'
      + 'idx=d.index;total=d.total;titles=d.titles||[];notes=d.notes||[];draw();});'
      + '$("p-cur").addEventListener("load",goto_);$("p-nxt").addEventListener("load",goto_);'
      + '$("p-prev").onclick=function(){cmd("prev");};$("p-next").onclick=function(){cmd("next");};'
      + '$("p-reset").onclick=function(){t0=Date.now();tick();};$("p-fminus").onclick=function(){font(-2);};$("p-fplus").onclick=function(){font(2);};'
      + 'addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;var k=e.key;'
      + 'if(k==="ArrowRight"||k==="ArrowDown"||k===" "||k==="PageDown"){e.preventDefault();cmd("next");}'
      + 'else if(k==="ArrowLeft"||k==="ArrowUp"||k==="PageUp"){e.preventDefault();cmd("prev");}'
      + 'else if(k==="Home"){e.preventDefault();cmd("goto",0);}else if(k==="End"){e.preventDefault();cmd("goto",total-1);}'
      + 'else if(k==="s"||k==="S"){cmd("close");}});'
      + 'var f=$("p-cur");f.srcdoc=DECK_HTML;$("p-nxt").srcdoc=DECK_HTML;tick();setInterval(tick,1000);';

    function presenterPage() {
      var json = JSON.stringify(previewHtml()).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
      return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Presenter</title><style>' + PAGE_STYLE + '</style></head><body>'
        + '<div id="p-bar"><span id="p-count"></span><span id="p-title"></span><span style="flex:1"></span>'
        + '<span id="p-timer">00:00:00</span><button id="p-reset" type="button">Reset</button><span id="p-clock"></span>'
        + '<button id="p-prev" type="button">&#9664; Prev</button><button id="p-next" type="button">Next &#9654;</button>'
        + '<button id="p-fminus" type="button">A-</button><button id="p-fplus" type="button">A+</button></div>'
        + '<div id="p-main"><div id="p-left"><div id="p-cur-box"><iframe id="p-cur" name="deck-preview" title="Current slide"></iframe></div></div>'
        + '<div id="p-right"><div id="p-label-next">Next:<span id="p-next-title"></span></div>'
        + '<div id="p-nxt-box"><iframe id="p-nxt" name="deck-preview" title="Next slide"></iframe><div id="p-end">End of presentation</div></div>'
        + '<div id="p-notes"></div></div></div>'
        + '<script>var DECK_HTML = ' + json + ';<\/script><script>' + PAGE_SCRIPT + '<\/script><\/body><\/html>';
    }

    function startWatching() {
      observer = new MutationObserver(function (records) {
        for (var i = 0; i < records.length; i++) if (!inPointer(records[i].target)) { schedule(); return; }
      });
      observer.observe(document.documentElement, {
        subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['class', 'data-fs-current']
      });
      // Filet pour les modèles qui gardent l'index hors du DOM, et détection de la fermeture de la fenêtre.
      poll = setInterval(function () {
        if (!isOpen()) { stopWatching(); return; }
        sendState(false);
      }, 250);
    }

    function stopWatching() {
      if (observer) { observer.disconnect(); observer = null; }
      if (poll) { clearInterval(poll); poll = 0; }
      if (pending) { clearTimeout(pending); pending = 0; }
      presenter = null; lastState = '';
    }

    window.isPresenterOpen = isOpen;

    window.openPresenter = function () {
      if (isOpen()) { presenter.focus(); return presenter; }
      var win = window.open('', 'deck-presenter', 'popup=yes,width=1280,height=800');
      if (!win) return null;
      presenter = win;
      win.document.open();
      win.document.write(presenterPage());
      win.document.close();
      startWatching();
      sendState(true);
      setTimeout(function () { sendState(true); }, 300);
      return win;
    };

    window.closePresenter = function () {
      var win = presenter;
      stopWatching();
      if (win && !win.closed) win.close();
    };

    window.togglePresenter = function () {
      if (isOpen()) window.closePresenter(); else window.openPresenter();
    };

    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!presenter || e.source !== presenter || !d || d.type !== 'deck-cmd') return;
      if (d.cmd === 'next') step(1);
      else if (d.cmd === 'prev') step(-1);
      else if (d.cmd === 'goto') goTo(parseInt(d.index, 10) || 0);
      else if (d.cmd === 'close') window.closePresenter();
      schedule();
    });

    window.addEventListener('pagehide', function () { if (isOpen()) presenter.close(); });

    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var ae = document.activeElement;
      if (ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
      var key = typeof e.key === 'string' ? e.key.toLowerCase() : '';
      if (key === 'f') {
        if (document.fullscreenElement) { if (typeof exitPresentation === 'function') exitPresentation(); }
        else if (typeof enterPresentation === 'function') enterPresentation();
      } else if (key === 'p') {
        if (typeof window.togglePointer === 'function') window.togglePointer();
      } else if (key === 's') {
        window.togglePresenter();
      } else if (key === 'e') {
        if (window.parent !== window) window.parent.postMessage({ type: 'deck-key', key: 'e' }, '*');
      }
    });
  })();
</script>
<!-- deck-presenter:end -->
