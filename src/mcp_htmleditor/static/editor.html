<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Editor</title>
  <link rel="stylesheet" href="/static/editor.css" />
</head>
<body>

  <!-- Toolbar serveur: nom fichier + statut + actions slides + toggle édition.
       La navigation slides est gérée par le HTML dans l'iframe. -->
  <div id="toolbar">
    <span id="toolbar-filename">—</span>
    <span id="toolbar-status" title="État de sauvegarde">●</span>
    <!-- Slide actions: only shown in presentation mode + edit mode -->
    <span id="toolbar-slide-actions" style="display:none">
      <button id="btn-insert-before" title="Insérer une slide avant la slide courante">＋ Slide avant</button>
      <button id="btn-insert-after" title="Insérer une slide après la slide courante">Slide après ＋</button>
      <button id="btn-delete-slide" title="Supprimer la slide courante">🗑 Slide</button>
    </span>
    <!-- Document block actions: only shown in document mode + edit mode -->
    <span id="toolbar-doc-actions" style="display:none">
      <button id="btn-insert-block-before" title="Insérer un bloc avant le bloc courant">＋ Bloc avant</button>
      <button id="btn-insert-block-after" title="Insérer un bloc après le bloc courant">Bloc après ＋</button>
    </span>
    <button id="edit-mode-btn" type="button" aria-pressed="false" title="Activer/désactiver le mode édition">
      <span class="edit-dot"></span>Édition
    </button>
    <button id="present-btn" type="button" title="Mode présentation plein écran">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><path d="M1 1h14v10H9v2h2v1H5v-1h2v-2H1zm1 1v8h12V2z"></path></svg>
    </button>
    <button id="export-pptx-btn" type="button" title="Télécharger en PPTX" style="display:none">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm1 7h-2v2h2v2h-2v2h-2v-2H9v2H7v-2h2v-2H7v-2h2V9H7V7h2V5h2v2h2V5h2v2h-2v2zm-4 0v2h2V9z"/></svg>
      PPTX
    </button>
    <button id="export-docx-btn" type="button" title="Télécharger en DOCX" style="display:none">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 11H7v-2h6zm2-4H7V7h8z"/></svg>
      DOCX
    </button>
  </div>

  <!-- Slide-type picker modal -->
  <div id="slide-picker" style="display:none">
    <div class="picker-backdrop"></div>
    <div class="picker-panel">
      <div class="picker-title">Choisir un type de slide</div>
      <div id="picker-grid"></div>
      <button class="picker-cancel">Annuler</button>
    </div>
  </div>

  <!-- Document block picker modal (reuse picker CSS) -->
  <div id="block-picker" style="display:none">
    <div class="picker-backdrop"></div>
    <div class="picker-panel">
      <div class="picker-title">Choisir un bloc de document</div>
      <div id="block-picker-grid"></div>
      <button class="picker-cancel">Annuler</button>
    </div>
  </div>

  <!-- "Modification LLM en cours" overlay -->
  <div id="update-overlay" style="display:none">
    <div class="overlay-content">&#8635; Modification en cours…</div>
  </div>

  <!-- The actual HTML file rendered as-is in a full-page iframe -->
  <iframe id="content-frame" src="/content-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-fullscreen" allow="fullscreen" allowfullscreen></iframe>

  <script src="/static/slide-layouts.js"></script>
  <script src="/static/doc-blocks.js"></script>
  <script src="/static/editor.js"></script>
</body>
</html>
