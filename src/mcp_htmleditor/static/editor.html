<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Editor</title>
  <link rel="stylesheet" href="/static/editor.css" />
</head>
<body>

  <!-- Toolbar serveur: nom fichier + statut + toggle édition uniquement.
       La navigation slides est gérée par le HTML dans l'iframe. -->
  <div id="toolbar">
    <span id="toolbar-filename">—</span>
    <span id="toolbar-status">●</span>
    <span id="toolbar-saved" style="display:none">✓ Sauvegardé</span>
    <label id="toolbar-edit-toggle">
      <input type="checkbox" id="edit-mode-checkbox"> Édition
    </label>
  </div>

  <!-- "Modification LLM en cours" overlay -->
  <div id="update-overlay" style="display:none">
    <div class="overlay-content">&#8635; Modification en cours…</div>
  </div>

  <!-- The actual HTML file rendered as-is in a full-page iframe -->
  <iframe id="content-frame" src="/content-frame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

  <script src="/static/editor.js"></script>
</body>
</html>
