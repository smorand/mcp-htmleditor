<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Editor</title>
  <link rel="stylesheet" href="/static/editor.css" />
</head>
<body>

  <!-- Toolbar serveur: nom fichier + statut + actions slides + toggle édition.
       La navigation slides est gérée par le HTML dans l'iframe. -->
  <div id="toolbar">
    <span id="toolbar-filename">—</span>
    <span id="toolbar-status" title="État de sauvegarde">●</span>
    <!-- Slide actions: only shown in presentation mode + edit mode -->
    <span id="toolbar-slide-actions" style="display:none">
      <button id="btn-insert-before" title="Insérer une slide avant la slide courante">＋ Slide avant</button>
      <button id="btn-insert-after" title="Insérer une slide après la slide courante">Slide après ＋</button>
      <button id="btn-delete-slide" title="Supprimer la slide courante">🗑 Slide</button>
    </span>
    <!-- Document block actions: only shown in document mode + edit mode -->
    <span id="toolbar-doc-actions" style="display:none">
      <button id="btn-insert-block-before" title="Insérer un bloc avant le bloc courant">＋ Bloc avant</button>
      <button id="btn-insert-block-after" title="Insérer un bloc après le bloc courant">Bloc après ＋</button>
    </span>
    <button id="requests-toggle" type="button" aria-expanded="false" aria-controls="requests-side" title="Show or hide the requests list">Requests (0)</button>
    <button id="ask-ai-btn" type="button" aria-expanded="false" aria-controls="ask-ai-panel" title="Queue a change request for the AI agent">Ask AI</button>
    <button id="edit-mode-btn" type="button" aria-pressed="false" title="Activer/désactiver le mode édition">
      <span class="edit-dot"></span>Édition
    </button>
    <!-- Undo/redo: structural mutations only (arch-node move, image insert,
         table row/col, gantt task, slide, document block). Plain text edits
         inside contenteditable keep using the browser's own native undo.
         Only meaningful in edit mode: hidden otherwise via JS (updateUndoRedoVisibility). -->
    <button id="undo-btn" type="button" title="Annuler (Ctrl/Cmd+Z)" disabled style="display:none">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><path d="M7 2 2 6l5 4V8c3.3 0 6 1.6 6 5h1c0-4.4-3.4-7-7-7z"></path></svg>
    </button>
    <button id="redo-btn" type="button" title="Rétablir (Ctrl/Cmd+Shift+Z)" disabled style="display:none">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" style="transform:scaleX(-1);"><path d="M7 2 2 6l5 4V8c3.3 0 6 1.6 6 5h1c0-4.4-3.4-7-7-7z"></path></svg>
    </button>
    <button id="present-btn" type="button" title="Mode présentation plein écran">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><path d="M1 1h14v10H9v2h2v1H5v-1h2v-2H1zm1 1v8h12V2z"></path></svg>
    </button>
    <button id="pointer-btn" type="button" title="Présenter avec le pointeur (L)" aria-label="Présenter avec le pointeur (L)" style="display:none">Pointeur</button>
    <button id="presenter-btn" type="button" title="Presenter view (S)" aria-label="Presenter view (S)" style="display:none">Presenter</button>
    <button id="notes-btn" type="button" aria-expanded="false" aria-controls="notes-panel" title="Speaker notes of the current slide" style="display:none">Notes</button>
    <button id="export-pptx-btn" type="button" title="Télécharger en PPTX" style="display:none">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm1 7h-2v2h2v2h-2v2h-2v-2H9v2H7v-2h2v-2H7v-2h2V9H7V7h2V5h2v2h2V5h2v2h-2v2zm-4 0v2h2V9z"/></svg>
      PPTX
    </button>
    <button id="export-docx-btn" type="button" title="Télécharger en DOCX" style="display:none">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 11H7v-2h6zm2-4H7V7h8z"/></svg>
      DOCX
    </button>
  </div>

  <!-- Save notices (SPEC-0009): never focused by script, no autofocus; only the two conflict buttons are focusable -->
  <div id="notices" role="status">
    <div id="save-conflict" class="notice" hidden>
      <span class="notice-text">The file changed on disk. Reload to see the changes, or keep your version.</span>
      <button type="button" id="save-conflict-reload">Reload</button>
      <button type="button" id="save-conflict-keep">Keep mine</button>
    </div>
    <div id="save-error" class="notice" hidden><span class="notice-text"></span></div>
    <div id="connection-lost" class="notice" hidden><span class="notice-text">Connection to the editor server lost</span></div>
  </div>

  <!-- Ask AI panel (US-0055): opened by #ask-ai-btn, never focused by script -->
  <div id="ask-ai-panel" role="dialog" aria-label="Ask AI" hidden>
    <label for="ask-ai-text">Describe the change</label>
    <textarea id="ask-ai-text" rows="5"></textarea>
    <div id="ask-ai-slide">Slide: none</div>
    <button type="button" id="ask-ai-queue">Queue request</button>
    <div id="ask-ai-message" role="status"></div>
  </div>

  <!-- Requests side list (US-0055): hidden until #requests-toggle opens it (SPEC-0022) -->
  <aside id="requests-side" aria-label="Requests" hidden>
    <h2 id="requests-heading">Requests (0)</h2>
    <ul id="requests-list"></ul>
  </aside>

  <!-- Speaker notes (SPEC-0022 FR-8): docked at the bottom, only in edit mode on a presentation -->
  <div id="notes-panel" role="region" aria-label="Speaker notes" hidden>
    <label for="notes-text">Speaker notes (current slide)</label>
    <textarea id="notes-text" rows="4"></textarea>
  </div>

  <!-- Slide-type picker modal -->
  <div id="slide-picker" style="display:none">
    <div class="picker-backdrop"></div>
    <div class="picker-panel">
      <div class="picker-title">Choisir un type de slide</div>
      <div id="picker-grid"></div>
      <button class="picker-cancel">Annuler</button>
    </div>
  </div>

  <!-- Document block picker modal (reuse picker CSS) -->
  <div id="block-picker" style="display:none">
    <div class="picker-backdrop"></div>
    <div class="picker-panel">
      <div class="picker-title">Choisir un bloc de document</div>
      <div id="block-picker-grid"></div>
      <button class="picker-cancel">Annuler</button>
    </div>
  </div>

  <!-- "Modification LLM en cours" overlay -->
  <div id="update-overlay" style="display:none">
    <div class="overlay-content">&#8635; Modification en cours…</div>
  </div>

  <!-- The actual HTML file rendered as-is in a full-page iframe -->
  <iframe id="content-frame" src="/content-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-fullscreen allow-popups allow-popups-to-escape-sandbox" allow="fullscreen" allowfullscreen></iframe>

  <!-- Text width bar (SPEC-0015): laid over the frame, never inserted into the framed document -->
  <div id="width-bar" role="separator" aria-orientation="vertical" aria-label="Largeur du texte"
       title="Glisser pour régler la largeur, double clic pour revenir à la largeur du modèle" tabindex="0" hidden>
    <span id="width-readout" hidden></span>
  </div>

  <script src="/static/slide-layouts.js"></script>
  <script src="/static/doc-blocks.js"></script>
  <script src="/static/editor-undo.js"></script>
  <script src="/static/editor-edit.js"></script>
  <script src="/static/editor-format.js"></script>
  <script src="/static/editor-menus.js"></script>
  <script src="/static/editor-save.js"></script>
  <script src="/static/editor-slides.js"></script>
  <script src="/static/editor-blocks.js"></script>
  <script src="/static/editor-drag.js"></script>
  <script src="/static/editor-width.js"></script>
  <script src="/static/editor-requests.js"></script>
  <script src="/static/editor-notes.js"></script>
  <script src="/static/editor.js"></script>
</body>
</html>
