<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Editor</title>
  <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.13/dist/css/grapes.min.css" />
  <link rel="stylesheet" href="/static/editor.css" />
</head>
<body>

  <!-- Slide navigation bar (hidden for document mode) -->
  <div id="slide-nav" style="display:none">
    <button id="nav-prev">&#9664;</button>
    <span id="nav-info">Slide 1 / 1</span>
    <button id="nav-next">&#9654;</button>
  </div>

  <!-- "Modification en cours" overlay -->
  <div id="update-overlay" style="display:none">
    <div class="overlay-content">&#8635; Modification en cours&hellip;</div>
  </div>

  <!-- GrapesJS canvas -->
  <div id="gjs"></div>

  <!-- GrapesJS library -->
  <script src="https://unpkg.com/grapesjs@0.21.13/dist/grapes.min.js"></script>
  <!-- Editor logic -->
  <script src="/static/editor.js"></script>

</body>
</html>
