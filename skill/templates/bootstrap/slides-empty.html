<!--
  Template: slides-empty
  Usage: Template minimal pour démarrer une nouvelle présentation
  Slides: 1 slide vide
  Date: 2024-01
-->
<!DOCTYPE html>
<html data-doc-type="presentation">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouvelle présentation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8e8e8;
      font-family: Arial, Helvetica, sans-serif;
    }

    section[data-type="slide"] {
      width: 1280px;
      min-height: 720px;
      margin: 40px auto;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      padding: 80px 100px;
      position: relative;
    }
  </style>
</head>
<body>

  <section data-type="slide" data-id="slide-1" data-title="Slide principal">
    <h1 data-editable="text" style="font-size:48px; color:#1a1a2e; margin-bottom:24px;">
      Titre de la présentation
    </h1>
    <p data-editable="text" style="font-size:22px; color:#555;">
      Sous-titre ou accroche
    </p>
  </section>

</body>
</html>
